# Optional: regenerate the Xcode project with XcodeGen (`brew install xcodegen && xcodegen`).
# The checked-in Plumage.xcodeproj already works with Xcode 16 or newer.
name: Plumage
options:
  bundleIdPrefix: com.plumage
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Plumage:
    type: application
    platform: iOS
    sources:
      - path: Plumage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plumage.birdatlas
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plumage
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
